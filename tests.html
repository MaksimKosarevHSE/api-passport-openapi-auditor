<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Passport — тесты</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      main { max-width: 900px; margin: 60px auto; }
      .test-summary, .test-case { padding: 18px; margin: 12px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
      .pass { border-color: #3b8068; } .fail { border-color: #9e4d49; }
      pre { white-space: pre-wrap; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Автоматическая проверка</p>
      <h1 style="font-size:54px">Тесты движка</h1>
      <div id="test-results"></div>
    </main>
    <script src="app.js"></script>
    <script src="tests.js"></script>
  </body>
</html>
